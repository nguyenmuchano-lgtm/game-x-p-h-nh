<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tetris - Xếp Hình Kinh Điển</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #111;
            font-family: 'Arial', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            color: #fff;
            user-select: none;
        }
        .game-container {
            display: flex;
            background: #222;
            padding: 15px;
            border-radius: 12px;
            border: 4px solid #f39c12;
            box-shadow: 0 15px 35px rgba(0,0,0,0.8);
            gap: 15px;
        }
        canvas {
            background: #000;
            border: 2px solid #444;
            display: block;
        }
        .sidebar {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            width: 130px;
        }
        .panel {
            background: #333;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            border: 1px solid #555;
        }
        .panel h3 {
            margin: 0 0 8px 0;
            font-size: 14px;
            color: #f1c40f;
        }
        .panel span {
            font-size: 20px;
            font-weight: bold;
            color: #fff;
        }
        #instruction {
            margin-top: 12px;
            background: #1f2c34;
            padding: 8px 18px;
            border-radius: 8px;
            font-size: 13px;
            border: 2px dashed #3498db;
            text-align: center;
            max-width: 380px;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <canvas id="tetris" width="240" height="480"></canvas>
        <div class="sidebar">
            <div class="panel">
                <h3>TIẾP THEO</h3>
                <canvas id="nextCanvas" width="90" height="90"></canvas>
            </div>
            <div class="panel">
                <h3>ĐIỂM SỐ</h3>
                <span id="score">0</span>
            </div>
            <div class="panel">
                <h3>CẤP ĐỘ</h3>
                <span id="level">1</span>
            </div>
        </div>
    </div>
    <div id="instruction"><b>HƯỚNG DẪN:</b> Phím <b>⬅️ ➡️</b> để di chuyển, <b>⬆️</b> để xoay khối, <b>⬇️</b> rơi nhanh, <b>Space</b> để thả rơi xuống đáy!</div>

    <script>
        const canvas = document.getElementById('tetris');
        const ctx = canvas.getContext('2d');
        const nextCanvas = document.getElementById('nextCanvas');
        const nextCtx = nextCanvas.getContext('2d');

        ctx.scale(20, 20);
        nextCtx.scale(20, 20);

        // Bảng màu các khối gạch Tetris
        const colors = [
            null,
            '#FF0D72', // I
            '#0DC2FF', // J
            '#0DFF72', // L
            '#F538FF', // O
            '#FF8E0D', // S
            '#FFE10D', // T
            '#3877FF'  // Z
        ];

        function createMatrix(w, h) {
            const matrix = [];
            while (h--) {
                matrix.push(new Array(w).fill(0));
            }
            return matrix;
        }

        function createPiece(type) {
            if (type === 'T') {
                return [
                    [0, 6, 0],
                    [6, 6, 6],
                    [0, 0, 0],
                ];
            } else if (type === 'O') {
                return [
                    [4, 4],
                    [4, 4],
                ];
            } else if (type === 'L') {
                return [
                    [0, 3, 0],
                    [0, 3, 0],
                    [0, 3, 3],
                ];
            } else if (type === 'J') {
                return [
                    [0, 2, 0],
                    [0, 2, 0],
                    [2, 2, 0],
                ];
            } else if (type === 'I') {
                return [
                    [0, 1, 0, 0],
                    [0, 1, 0, 0],
                    [0, 1, 0, 0],
                    [0, 1, 0, 0],
                ];
            } else if (type === 'S') {
                return [
                    [0, 5, 5],
                    [5, 5, 0],
                    [0, 0, 0],
                ];
            } else if (type === 'Z') {
                return [
                    [7, 7, 0],
                    [0, 7, 7],
                    [0, 0, 0],
                ];
            }
        }

        function drawMatrix(matrix, offset, context = ctx) {
            matrix.forEach((row, y) => {
                row.forEach((value, x) => {
                    if (value !== 0) {
                        context.fillStyle = colors[value];
                        context.fillRect(x + offset.x, y + offset.y, 1, 1);
                        context.strokeStyle = '#222';
                        context.lineWidth = 0.05;
                        context.strokeRect(x + offset.x, y + offset.y, 1, 1);
                    }
                });
            });
        }

        function merge(arena, player) {
            player.matrix.forEach((row, y) => {
                row.forEach((value, x) => {
                    if (value !== 0) {
                        arena[y + player.pos.y][x + player.pos.x] = value;
                    }
                });
            });
        }

        function rotate(matrix, dir) {
            for (let y = 0; y < matrix.length; ++y) {
                for (let x = 0; x < y; ++x) {
                    [
                        matrix[x][y],
                        matrix[y][x],
                    ] = [
                        matrix[y][x],
                        matrix[x][y],
                    ];
                }
            }
            if (dir > 0) {
                matrix.forEach(row => row.reverse());
            } else {
                matrix.reverse();
            }
        }

        function collide(arena, player) {
            const m = player.matrix;
            const o = player.pos;
            for (let y = 0; y < m.length; ++y) {
                for (let x = 0; x < m[y].length; ++x) {
                    if (m[y][x] !== 0 &&
                       (arena[y + o.y] && arena[y + o.y][x + o.x]) !== 0) {
                        return true;
                    }
                }
            }
            return false;
        }

        function arenaSweep() {
            let rowCount = 1;
            outer: for (let y = arena.length - 1; y > 0; --y) {
                for (let x = 0; x < arena[y].length; ++x) {
                    if (arena[y][x] === 0) {
                        continue outer;
                    }
                }
                const row = arena.splice(y, 1)[0].fill(0);
                arena.unshift(row);
                ++y;

                player.score += rowCount * 10;
                rowCount *= 2;
            }
            document.getElementById('score').innerText = player.score;
            document.getElementById('level').innerText = Math.floor(player.score / 100) + 1;
        }

        function playerDrop() {
            player.pos.y++;
            if (collide(arena, player)) {
                player.pos.y--;
                merge(arena, player);
                playerReset();
                arenaSweep();
            }
            dropCounter = 0;
        }

        function playerMove(dir) {
            player.pos.x += dir;
            if (collide(arena, player)) {
                player.pos.x -= dir;
            }
        }

        function playerReset() {
            const pieces = 'TJLOSZI';
            if (player.nextMatrix === null) {
                player.matrix = createPiece(pieces[Math.floor(Math.random() * pieces.length)]);
            } else {
                player.matrix = player.nextMatrix;
            }
            player.nextMatrix = createPiece(pieces[Math.floor(Math.random() * pieces.length)]);
            
            player.pos.y = 0;
            player.pos.x = (arena[0].length / 2 | 0) - (player.matrix[0].length / 2 | 0);
            
            if (collide(arena, player)) {
                arena.forEach(row => row.fill(0));
                player.score = 0;
                document.getElementById('score').innerText = player.score;
            }
        }

        function playerRotate(dir) {
            const pos = player.pos.x;
            let offset = 1;
            rotate(player.matrix, dir);
            while (collide(arena, player)) {
                player.pos.x += offset;
                offset = -(offset + (offset > 0 ? 1 : -1));
                if (offset > player.matrix[0].length) {
                    rotate(player.matrix, -dir);
                    player.pos.x = pos;
                    return;
                }
            }
        }

        function playerDropInstant() {
            while (!collide(arena, player)) {
                player.pos.y++;
            }
            player.pos.y--;
            merge(arena, player);
            playerReset();
            arenaSweep();
            dropCounter = 0;
        }

        let dropCounter = 0;
        let dropInterval = 1000;
        let lastTime = 0;

        function update(time = 0) {
            const deltaTime = time - lastTime;
            lastTime = time;
            dropCounter += deltaTime;

            let currentInterval = Math.max(150, dropInterval - (Math.floor(player.score / 100) * 80));
            if (dropCounter > currentInterval) {
                playerDrop();
            }

            draw();
            requestAnimationFrame(update);
        }

        function draw() {
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            drawMatrix(arena, {x: 0, y: 0});
            drawMatrix(player.matrix, player.pos);

            // Vẽ khối tiếp theo
            nextCtx.fillStyle = '#111';
            nextCtx.fillRect(0, 0, nextCanvas.width, nextCanvas.height);
            if (player.nextMatrix) {
                let offsetX = (4 - player.nextMatrix[0].length) / 2;
                let offsetY = (4 - player.nextMatrix.length) / 2;
                drawMatrix(player.nextMatrix, {x: offsetX, y: offsetY}, nextCtx);
            }
        }

        const arena = createMatrix(12, 24);

        const player = {
            pos: {x: 0, y: 0},
            matrix: null,
            nextMatrix: null,
            score: 0,
        };

        // Điều khiển phím bấm
        document.addEventListener('keydown', event => {
            if (event.key === 'ArrowLeft') {
                playerMove(-1);
            } else if (event.key === 'ArrowRight') {
                playerMove(1);
            } else if (event.key === 'ArrowDown') {
                playerDrop();
            } else if (event.key === 'ArrowUp') {
                playerRotate(1);
            } else if (event.key === ' ') {
                event.preventDefault();
                playerDropInstant();
            }
        });

        playerReset();
        update();
    </script>
</body>
</html>
